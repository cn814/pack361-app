name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code.
permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    name: Permission tests
    # Pinned so the Postgres that comes installed on GitHub's machine stays the same.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The Postgres already installed on GitHub's machine (16; the tests need 15 or later), started
      # here instead of a downloaded container: the container download (Docker Hub, then the AWS
      # mirror) failed often enough to block releases. Installs Postgres only if an image lacks it.
      - name: Start Postgres
        run: |
          if ! command -v pg_ctlcluster >/dev/null; then sudo apt-get update -q && sudo apt-get install -yq postgresql; fi
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost -q && break; sleep 1; done
          sudo -u postgres psql -qc "alter user postgres password 'postgres'"
          sudo -u postgres createdb packtest
          psql --version
      - run: supabase/tests/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/packtest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks looks through every commit for keys, tokens and passwords that shouldn't be in
      # the code. The download is checked against its published checksum before it runs.
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner .
